  home:
    greeting: "¡Holi! Mucho gusto"
    bio_p1: "Soy la Dra. Adriana Felisa Chávez De la Peña, una psicóloga cuantitativa mexicana (<i>De Iztapalapa para el mundo!</i>) interesada principalmente en temas de psicometría, medición, evaluación y modelamiento de procesos cognitivos."
    bio_p2: "Soy <span class=\"emphasis-black\">doctora en Ciencias Cognitivas</span> por parte de la <span class=\"emphasis\">Universidad de California, Irvine (UCI)</span>, donde también realicé una <span class=\"emphasis-black\">maestría en Estadística</span>. Mi trabajo se enfoca en el desarrollo de modelos matemáticos que den cuenta de la relación entre el comportamiento observable y los procesos cognitivos subyacentes, y en la implementación de dichos modelos bajo un marco Bayesiano. Mi principal línea de investigación gira en torno al uso de modelos jerárquicos Bayesianos para el estudio de diferencias individuales y el efecto de covariables de interés (por ejemplo, la edad, el género, o el nivel de dominio reflejado en una prueba de desempeño) sobre diferentes componentes cognitivos."
    bio_p3: "Actualmente trabajo en el Departamento de Educación de la <span class=\"emphasis\">Universidad de Stanford</span>, haciendo una estancia de <span class=\"emphasis-black\">postdoctorado</span> con la Dra. Jelena Obradović. Trabajo en un proyecto que se centra en el desarrollo de herramientas de medición robustas y escalables para estudiar funciones ejecutivas, creatividad y exploración en infantes."
